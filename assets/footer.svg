<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="130" viewBox="0 0 1200 130" fill="none">
  <defs>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="2" fill="#eab308" opacity="0.18"/>
    </pattern>
    <linearGradient id="bar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a371f7"/>
      <stop offset="55%" stop-color="#3fb950"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>
    <style>
      .fade { opacity: 0; animation: fadeIn 1.2s ease .2s forwards; }
      @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
      .wave { animation: drift 8s ease-in-out infinite; }
      @keyframes drift { 0%, 100% { transform: translateX(0); } 50% { transform: translateX(-24px); } }
      .mono { font-family: 'JetBrains Mono', 'Fira Code', Consolas, monospace; }
      .sans { font-family: 'Inter', 'Segoe UI', Arial, sans-serif; }
    </style>
  </defs>

  <rect width="1200" height="130" fill="#0d1117"/>
  <rect width="1200" height="130" fill="url(#dots)"/>
  <rect x="0" y="0" width="1200" height="3" fill="url(#bar)"/>

  <g class="fade">
    <text x="600" y="58" text-anchor="middle" class="mono" font-size="19" letter-spacing="3" fill="#e3b341">LET'S BUILD SOMETHING PEOPLE ACTUALLY USE</text>
    <text x="600" y="90" text-anchor="middle" class="sans" font-size="15" fill="#8b949e">Ngabdullah Hakim · Surabaya, Indonesia · ngabdullahhakim.com</text>
  </g>

  <path class="wave" d="M-40 116 Q 60 100, 160 112 T 360 112 T 560 112 T 760 112 T 960 112 T 1160 112 T 1360 112" stroke="#eab308" stroke-width="2.5" fill="none" opacity="0.55"/>
  <path class="wave" d="M-40 124 Q 60 110, 160 120 T 360 120 T 560 120 T 760 120 T 960 120 T 1160 120 T 1360 120" stroke="#30363d" stroke-width="2" fill="none"/>
</svg>
