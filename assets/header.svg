<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" fill="none">
  <defs>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="2" fill="#eab308" opacity="0.22"/>
    </pattern>
    <linearGradient id="bar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#eab308"/>
      <stop offset="55%" stop-color="#3fb950"/>
      <stop offset="100%" stop-color="#a371f7"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="0 0; -0.6 0; 0 0" dur="9s" repeatCount="indefinite"/>
    </linearGradient>
    <style>
      .fade-up { opacity: 0; animation: fadeUp .9s cubic-bezier(.16,1,.3,1) forwards; }
      .d1 { animation-delay: .10s; } .d2 { animation-delay: .28s; }
      .d3 { animation-delay: .46s; } .d4 { animation-delay: .68s; }
      @keyframes fadeUp { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
      .cursor { animation: blink 1.05s steps(1) infinite; }
      @keyframes blink { 0%, 55% { opacity: 1; } 56%, 100% { opacity: 0; } }
      .pulse { animation: pulse 2.6s ease-in-out infinite; transform-origin: center; transform-box: fill-box; }
      @keyframes pulse { 0%, 100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.5); opacity: .65; } }
      .name { font-family: 'Inter', 'Segoe UI', Arial, sans-serif; font-weight: 800; letter-spacing: -1.5px; }
      .mono { font-family: 'JetBrains Mono', 'Fira Code', Consolas, monospace; }
      .sans { font-family: 'Inter', 'Segoe UI', Arial, sans-serif; }
    </style>
  </defs>

  <rect width="1200" height="320" fill="#0d1117"/>
  <rect width="1200" height="320" fill="url(#dots)"/>
  <rect x="0" y="308" width="1200" height="4" fill="url(#bar)"/>

  <g class="fade-up d1">
    <circle cx="72" cy="64" r="5" fill="#3fb950" class="pulse"/>
    <text x="90" y="71" class="mono" font-size="16" letter-spacing="3" fill="#8b949e">HELLO, WORLD. I AM</text>
  </g>

  <g class="fade-up d2">
    <text x="70" y="150" class="name" font-size="72" fill="#f0f6fc">NGABDULLAH HAKIM</text>
    <rect x="838" y="104" width="15" height="46" fill="#e3b341" class="cursor"/>
  </g>

  <g class="fade-up d3">
    <text x="72" y="196" class="mono" font-size="21" letter-spacing="2.5" fill="#e3b341">FULLSTACK SOFTWARE ENGINEER</text>
    <text x="72" y="228" class="sans" font-size="19" fill="#8b949e">Building products people actually use, with Go, Laravel, React &amp; Flutter, from Surabaya.</text>
  </g>

  <g class="fade-up d4">
    <g>
      <rect x="70" y="254" width="308" height="38" rx="19" fill="#161b22" stroke="#30363d"/>
      <circle cx="94" cy="273" r="5" fill="#3fb950"/>
      <text x="110" y="279" class="mono" font-size="14.5" fill="#f0f6fc">AIRE · SERVICE PLATFORM</text>
    </g>
    <g>
      <rect x="392" y="254" width="322" height="38" rx="19" fill="#161b22" stroke="#30363d"/>
      <circle cx="416" cy="273" r="5" fill="#a371f7"/>
      <text x="432" y="279" class="mono" font-size="14.5" fill="#f0f6fc">VENUS GADGET · E-COMMERCE</text>
    </g>
    <g>
      <rect x="728" y="254" width="352" height="38" rx="19" fill="#161b22" stroke="#30363d"/>
      <circle cx="752" cy="273" r="5" fill="#eab308"/>
      <text x="768" y="279" class="mono" font-size="14.5" fill="#f0f6fc">TKA &amp; UTBK TRACKER · FOUNDER</text>
    </g>
  </g>
</svg>
